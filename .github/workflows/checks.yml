name: Application checks
on:
  pull_request:
  push:
    branches: [main, feat/supabase-auth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/test/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-dev.txt -r softskills-grader/requirements.txt
      - run: python -m pytest server/tests -q
