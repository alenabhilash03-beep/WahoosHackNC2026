name: Community frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/*.test.mjs
      - run: npm ci --prefix tools/checks
      - run: npx --prefix tools/checks playwright install --with-deps chromium
      - run: npm --prefix tools/checks run test:community
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-browser-qa
          path: work/browser-qa/community-*.png
