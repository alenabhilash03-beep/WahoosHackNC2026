# SpeakUp on Fly.io: the FastAPI server plus the static site, same origin.
# Deploy from the repository root with `fly deploy`. Steps: server/README.md, "Deploy to Fly.io".
# Live at https://speak-up.fly.dev ("speakup" was already taken on Fly).
app = "speak-up"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Grading runs in the background of one machine: keep exactly one, always on.
  auto_stop_machines = "off"
  # If that machine is ever stopped (a crash, or a Fly trial account, which stops machines
  # after 5 minutes), the next request starts it again. This never creates a second machine.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/config.js"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# Grader cache: the same recording keeps the same report across deploys.
# Create once: fly volumes create arena_data --size 1 --region iad
[mounts]
  source = "arena_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpus = 1
