# Word lists our code counts in the transcript. Edit freely.
# Matching is case-insensitive and ignores punctuation. Multi-word phrases work.

fillers:
  - um
  - uh
  - uhm
  - erm
  - er
  - ah
  - hmm
  - mm
  - you know
  - i mean
  - basically
  - literally
  - or something
  # - like        # ambiguous ("I like dogs"); enable only if you accept false hits

# Colloquial hedges only. Durik et al. (2008) found that colloquial hedges
# ("sort of", "kind of", "somewhat", "possibly") lowered ratings of the speaker
# and the argument, while professional hedges ("may", "probably", "seem to",
# "likely") did not, so professional hedges are deliberately NOT listed.
hedges:
  - sort of        # tested in Durik et al. 2008
  - kind of        # tested
  - somewhat       # tested
  - possibly       # tested
  - i guess        # same colloquial type; our extension, not tested
  - i feel like    # our extension
  - not sure       # our extension
  - maybe          # our extension

connectives:
  - because
  - therefore
  - thus
  - consequently
  - as a result
  - which means
  - this means
  - that is why
  - that's why
  - for example
  - for instance
  - however
  - although
  - on the other hand
  - first
  - second
  - third
  - finally
  - in conclusion

# First-person-plural and second-person words only, so the rate is comparable
# with the published LIWC2015 norms for the "we" and "you" categories.
