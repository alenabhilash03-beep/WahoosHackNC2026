# ---------------------------------------------------------------------------
# GRADING STANDARDS  -  this file is the rubric. Edit it; no code changes needed.
#
# How a grade is computed:
#   1. Every metric below is MEASURED (by our code, from ElevenLabs word timings,
#      the raw audio, or Gemini's extracted argument structure).
#   2. The measured value falls into one BUCKET, which gives that metric 0-100.
#        from = inclusive lower edge, to = exclusive upper edge.
#        Leave "from" out for "anything below", leave "to" out for "anything above".
#        A value that matches no bucket gets "else" (0 if you leave "else" out).
#   3. Factor base   = weighted average of its metric scores.
#   4. Factor score  = base minus DEDUCTIONS, clamped to 0-100.
#        deduction = points_each x (count - free), capped at max_points.
#   5. Overall score = weighted average of the factor scores.
#
# WHERE THE NUMBERS COME FROM (full sources and caveats: README, "Research basis")
#
#   One score ladder is used for every metric:
#     100  inside the range a study links to the best listener outcome,
#          or inside the published range for fluent speakers
#      85  normal for fluent speakers; no study shows harm
#      65  outside the published normal range, or on the wrong side of a
#          published threshold
#      40  a range where a study MEASURED a negative effect on listeners,
#          or outside everything the studies observed
#       0  the element is missing altogether (logic only)
#
#   Metric weights follow the strength of the evidence:
#     tier A = 3   an experiment or meta-analysis ties the metric to listener
#                  judgments AND gives a number in our units
#     tier B = 2   a published norm in our units, or an effect with no threshold;
#                  tier B never scores below 65 because no study shows harm
#     tier C = 1   no usable published number: placeholder, calibrate on your data
#     RULE         a rule of the game, not a research finding
#
# Factor weights (20/20/20/25/15) and deduction sizes are team decisions, not
# research findings. Weights are relative and re-balance if you delete anything.
# Every metric name must exist in the catalogue (python grade.py --list-metrics).
# ---------------------------------------------------------------------------

version: "2026-10-10.2-research"

session:
  allotted_seconds: 60        # how long the speaker is given
  min_words_to_grade: 40      # fewer words than this = not gradable

apis:
  elevenlabs:
    model_id: scribe_v2
    language_code: en
    seed: 7
  gemini:
    model: gemini-3.8-flash
    seed: 7
    thinking_level: low

# Definitions used while measuring. Changing these changes WHAT is counted.
analysis:
  pause_min_seconds: 0.25       # De Jong & Bosker 2013: 250 ms is the recommended silent-pause cut-off
  long_pause_seconds: 2.0       # Campione & Veronis 2002: pauses over 2 s are 2.8% of spontaneous pauses, 0% of read speech
  pace_window_seconds: 10       # Hincks 2005 measures pitch variation over 10 s windows
  pitch_floor_hz: 70
  pitch_ceiling_hz: 400
  uptalk_rise_semitones: 2.0    # detector setting, not from research
  monotone_pvq_pct: 11          # Hincks 2005: lowest speaker mean observed was .11
  vocabulary_window_words: 40

grades:
  - {from: 93, letter: "A"}
  - {from: 90, letter: "A-"}
  - {from: 87, letter: "B+"}
  - {from: 83, letter: "B"}
  - {from: 80, letter: "B-"}
  - {from: 77, letter: "C+"}
  - {from: 73, letter: "C"}
  - {from: 70, letter: "C-"}
  - {from: 60, letter: "D"}
  - {from: 0,  letter: "F"}

factors:

  # ------------------------------------------------------------------ PACE
  pace:
    weight: 20
    metrics:
      words_per_minute:            # TIER A. Guyer et al. 2025; norms from Wang 2021
        weight: 3
        buckets:
          - {from: 140, to: 195, score: 100}   # 148 and 192 wpm: high confidence ratings and best message processing
          - {from: 130, to: 140, score: 85}
          - {from: 195, to: 205, score: 85}    # 197 wpm: still confident, processing starts to fall
          - {from: 113, to: 130, score: 65}
          - {from: 205, to: 218, score: 65}    # 202 wpm: argument processing significantly lower
          - {to: 113,            score: 40}    # 113 wpm: confidence rated 2.95 of 7
          - {from: 218,          score: 40}    # beyond the natural range the study covers
      pause_time_pct:              # TIER B. Wang 2008 (21% silent); Nishizawa 2024 (about 26%, derived)
        weight: 2
        buckets:
          - {from: 15, to: 30, score: 100}
          - {from: 10, to: 15, score: 85}
          - {from: 30, to: 40, score: 85}
        else: 65
      time_used_pct:               # RULE. Share of the allotted time actually used.
        weight: 1
        buckets:
          - {from: 90,         score: 100}
          - {from: 75, to: 90, score: 80}
          - {from: 50, to: 75, score: 50}
          - {to: 50,           score: 20}
    deductions:
      # One pause over 2 s is within what spontaneous speech normally contains.
      - {metric: long_pause_count, free: 1, points_each: 5, max_points: 20}

  # --------------------------------------------------------------- DICTION
  diction:
    weight: 20
    metrics:
      fillers_per_100_words:       # TIER A. Bortfeld et al. 2001; Lee & Papafragou 2026
        weight: 3
        buckets:
          - {to: 2.0,             score: 100}  # fewer than every speaker group in Bortfeld (lowest group mean 2.04)
          - {from: 2.0, to: 2.9,  score: 85}   # the conversational norm (group means 2.04 to 2.88, overall 2.56)
          - {from: 2.9, to: 7.9,  score: 65}   # above the norm
          - {from: 7.9,           score: 40}   # 7.94 per 100: speakers rated less certain and less prepared
      vocabulary_variety_pct:      # TIER C. No adult norm exists for this window and task.
        weight: 1
        buckets:
          - {from: 80,         score: 100}
          - {from: 74, to: 80, score: 85}
        else: 65
      clarity_pct:                 # TIER C. Transcriber confidence; specific to the speech engine.
        weight: 1
        buckets:
          - {from: 92,         score: 100}
          - {from: 85, to: 92, score: 85}
        else: 65
    deductions:
      # Bortfeld et al. 2001: 1.47 repeats per 100 words, about 2 in a 150-word speech.
      - {metric: repeated_word_count, free: 2, points_each: 3, max_points: 15}

  # ------------------------------------------------------------------ TONE
  tone:
    weight: 20
    metrics:
      pitch_variation_pct:         # TIER A. Hincks 2005 pitch variation quotient (x100)
        weight: 3
        buckets:
          - {from: 20, to: 34, score: 100}   # upper part of the observed speaker range (.11 to .24)
          - {from: 16, to: 20, score: 85}    # rated more lively than monotone
          - {from: 11, to: 16, score: 65}    # below .16: rated more monotone than lively
          - {to: 11,           score: 40}    # flatter than any speaker observed
          - {from: 34,         score: 65}    # above any 10 s segment observed; likely tracking noise
      hedges_per_100_words:        # TIER A. Durik et al. 2008 (colloquial hedges only)
        weight: 3
        buckets:
          - {to: 0.6,             score: 100}  # none in a 150-word speech
          - {from: 0.6, to: 1.9,  score: 85}   # below the tested density
          - {from: 1.9,           score: 40}   # 6 in about 310 words: lower source and argument ratings
      uptalk_pct:                  # TIER B. Vaughan-Johnston et al. 2024; Linneman 2013
        weight: 2
        buckets:
          - {to: 10,           score: 100}
          - {from: 10, to: 37, score: 85}
          - {from: 37,         score: 65}    # the rate measured on a TV quiz show (weak anchor)
    deductions:
      - {metric: monotone_window_count, free: 1, points_each: 5, max_points: 15}

  # ----------------------------------------------------------------- LOGIC
  logic:
    weight: 25
    metrics:
      supported_arguments:         # TIER A. O'Keefe 1998; Shu & Carlson 2014
        weight: 3
        buckets:
          - {from: 3,        score: 100}   # three claims was the most persuasive number
          - {from: 2, to: 3, score: 85}
          - {from: 1, to: 2, score: 65}
          - {to: 1,          score: 0}
      structure_points:            # TIER A. O'Keefe 1997: stating the conclusion explicitly, r = .12
        weight: 3
        buckets:
          - {from: 2,        score: 100}   # position stated and restated
          - {from: 1, to: 2, score: 85}    # position stated explicitly once
          - {to: 1,          score: 40}    # conclusion left unstated: measurably less persuasive
      counterargument_level:       # TIER A. O'Keefe 1999. Note the order: 2 > 0 > 1.
        weight: 3
        buckets:
          - {from: 2,        score: 100}   # raised and rebutted: r = +.077 vs one-sided
          - {to: 1,          score: 85}    # one-sided: the baseline
          - {from: 1, to: 2, score: 65}    # raised but not rebutted: r = -.049 vs one-sided
      connectives_per_100_words:   # TIER C. No published rate for this word list.
        weight: 1
        buckets:
          - {from: 3,        score: 100}
          - {from: 2, to: 3, score: 85}
        else: 65
    deductions:                    # RULES. Sizes are team decisions.
      - {metric: reasoning_fallacy_count, free: 0, points_each: 8,  max_points: 24}
      - {metric: unsupported_claim_count, free: 1, points_each: 5,  max_points: 15}
      - {metric: stance_mismatch,         free: 0, points_each: 40, max_points: 40}
      - {metric: stance_unclear,          free: 0, points_each: 15, max_points: 15}

  # --------------------------------------------------- APPEAL TO EMOTION
  emotion:
    weight: 15
    metrics:
      emotional_appeals:           # TIER B. Antonakis et al. 2012: the tactics work; no dose is published
        weight: 2
        buckets:
          - {from: 3,        score: 100}
          - {from: 1, to: 3, score: 85}
          - {to: 1,          score: 65}
      audience_address_per_100_words:   # TIER B. LIWC2015 norms for "we" + "you"
        weight: 2
        buckets:
          - {from: 4.9,           score: 100}  # natural speech norm: 0.87 + 4.04
          - {from: 2.4, to: 4.9,  score: 85}   # between the all-genre mean (0.72 + 1.70) and the speech norm
          - {to: 2.4,             score: 65}
      emotion_words_per_100_words: # TIER C. Our word list is not the LIWC dictionary, so LIWC norms do not transfer.
        weight: 1
        buckets:
          - {from: 2, to: 7,  score: 100}
          - {from: 1, to: 2,  score: 85}
          - {from: 7, to: 10, score: 85}
        else: 65
    deductions:                    # RULE.
      - {metric: manipulative_appeal_count, free: 0, points_each: 10, max_points: 20}
