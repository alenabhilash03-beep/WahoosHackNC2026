<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debate Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <header class="title">
    <p class="kicker">NetworkMaxx</p>
    <h1>DEBATE<br />ARENA</h1>
  </header>

  <div class="menu">
    <button id="argue" class="pixel-btn">ARGUE</button>
    <p class="hint">The floor is yours.</p>
  </div>

  <nav class="account-bar" aria-label="Account">
    <span id="account-user" aria-live="polite"></span>
    <button id="account-open" class="account-btn">LOG IN / SIGN UP</button>
    <button id="account-logout" class="account-btn" hidden>LOG OUT</button>
  </nav>
  <dialog id="account-dialog" aria-labelledby="account-heading">
    <button id="account-close" class="account-btn close" aria-label="Close account dialog">×</button>
    <h2 id="account-heading">LOG IN</h2>
    <form id="account-form">
      <label id="name-field" hidden>Display name
        <input name="displayName" autocomplete="nickname" maxlength="40" />
      </label>
      <label>Email<input name="email" type="email" autocomplete="email" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <p id="account-message" role="status" aria-live="polite"></p>
      <button id="account-submit" class="account-btn" type="submit" disabled>LOG IN</button>
    </form>
    <button id="account-switch" class="account-btn">New here? Create an account</button>
  </dialog>
  <script src="config.js"></script>
  <script type="module" src="js/auth.js"></script>

  <script type="module" src="main.js"></script>
</body>
</html>
