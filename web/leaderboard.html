<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard · SpeakUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="progress.css" />
  <link rel="stylesheet" href="solo.css" />
  <script src="config.js"></script>
</head>
<body>
  <header class="valance"><p class="kicker">SPEAKUP</p><h1>LEADERBOARD</h1></header>
  <main class="page">
    <nav class="solo-nav" aria-label="Main"><a class="back" href="index.html">◀ ARENA</a><a class="back" href="practice.html">RECORD A SPEECH</a><a class="back" href="progress.html">YOUR PROGRESS</a></nav>
    <p id="status" role="status" aria-live="polite">Loading the board…</p>
    <button class="radar-toggle" id="reload" type="button" hidden>RETRY</button>
    <div id="content" hidden>
      <section class="solo-panel" aria-labelledby="you-title">
        <h2 id="you-title">YOUR PLACE</h2>
        <p class="lede" id="you"></p>
        <form id="name-form" class="name-form" novalidate>
          <label class="field" for="name"><span id="name-label">NAME ON THE BOARD</span></label>
          <input id="name" name="name" type="text" maxlength="20" autocomplete="nickname" spellcheck="false" aria-describedby="name-help name-error" />
          <button class="radar-toggle" id="save" type="submit">JOIN THE BOARD</button>
          <p class="meta" id="name-help">3 to 20 letters, digits or underscores. Others see this name and your best score, never your recordings.</p>
          <p class="name-error" id="name-error" role="alert"></p>
        </form>
      </section>
      <section class="solo-panel" aria-labelledby="board-title">
        <h2 id="board-title">TOP SPEAKERS</h2>
        <p class="lede">Each speaker's best graded speech. Tries are unlimited: record again to climb.</p>
        <ol id="board" class="board"></ol>
      </section>
    </div>
  </main>
  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
