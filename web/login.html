<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Debate Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="progress.css">
  <link rel="stylesheet" href="auth.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="valance"><p class="kicker">DEBATE ARENA</p><h1>TAKE YOUR PLACE</h1></header>
  <main class="page auth-page">
    <a class="back" href="index.html">◀ ARENA</a>
    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="kicker">YOUR NEXT ROUND</p>
      <h2 id="auth-title">SIGN IN</h2>
      <p class="auth-copy" id="auth-copy">Keep your speeches and progress with you, wherever you sign in.</p>
      <div id="auth-providers" class="auth-providers" role="group" aria-label="Sign-in options" aria-busy="true">
        <button class="auth-provider auth-google" type="button" data-provider="google" disabled>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.41 14.41 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>
        <button class="auth-provider auth-github" type="button" data-provider="github" disabled>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>Continue with GitHub</span>
        </button>
      </div>
      <p id="auth-status" class="auth-copy" role="status" aria-live="polite">Connecting…</p>
      <button class="auth-link" id="auth-retry" type="button" hidden>Try again</button>
      <p class="auth-copy auth-note">New here? Signing in creates your arena account.</p>
      <a class="auth-link" id="local-play" href="practice.html" hidden>Continue local practice</a>
      <noscript><p>Enable JavaScript to sign in and load your private speeches.</p></noscript>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
