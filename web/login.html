<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · SpeakUp</title>
  <link rel="stylesheet" href="progress.css">
  <link rel="stylesheet" href="auth.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="valance"><p class="kicker">SPEAKUP</p><h1>TAKE YOUR PLACE</h1></header>
  <main class="page auth-page">
    <a class="back" href="index.html">◀ ARENA</a>
    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="kicker">YOUR NEXT ROUND</p>
      <h2 id="auth-title">SIGN IN</h2>
      <p class="auth-copy" id="auth-copy">Keep your speeches and progress with you, wherever you sign in.</p>
      <div id="auth-providers" class="auth-providers" role="group" aria-label="Sign-in options" aria-busy="true">
        <button class="auth-provider auth-github" type="button" data-provider="github" disabled>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>Continue with GitHub</span>
        </button>
      </div>
      <p id="auth-status" class="auth-copy" role="status" aria-live="polite">Connecting…</p>
      <button class="auth-link" id="auth-retry" type="button" hidden>Try again</button>
      <p class="auth-copy auth-note">New here? Signing in creates your arena account.</p>
      <a class="auth-link" id="local-play" href="practice.html" hidden>Continue local practice</a>
      <noscript><p>Enable JavaScript to sign in and load your private speeches.</p></noscript>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
